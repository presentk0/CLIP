    key: ${deepl.api.key}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 3600000      # 1시간 (Access Token)
  refresh-expiration: 1209600000 # 14일 (Refresh Token)

google:
  client-id: ${google.client-id}

youtube:
  api:
    key: ${YOUTUBE_API_KEY}
    base-url: https://www.googleapis.com/youtube/v3

azure:
  speech:
    key: ${AZURE_SPEECH_KEY}
    region: koreacentral
    language: en-US
    voice-name-female: en-US-JennyNeural
    voice-name-male: en-US-GuyNeural

aws:
  region: ap-northeast-2
  profile: ${AWS_PROFILE:}
  s3:
    bucket: ${AWS_S3_BUCKET}
    audio-prefix: chat/
    presigned-url-expiration: 300
    download-url-expiration: 1800

clipzy:
  notice:
    base-url: https://clipzy.com/notices
