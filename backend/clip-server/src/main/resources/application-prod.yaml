spring:
  config:
    import:
      - "aws-secretsmanager:MVP/spring-app/env"
      - "aws-secretsmanager:MVP/spring-app/OpenAI"
      - "aws-secretsmanager:MVP/spring-app/DeepL"
      - "aws-secretsmanager:rds!db-4db1156f-53de-4604-8b82-75c5758d41ae"

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${spring.datasource.url}
    username: ${username}
    password: ${password}

  data:
    redis:
      host: ${spring.data.redis.host}
      port: ${spring.data.redis.port}
      password: ${spring.data.redis.password}
      ssl:
        enabled: ${spring.data.redis.ssl.enabled}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        instance-profile: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

openai:
  api:
    key: ${openai.api.key}
    url: https://api.openai.com/v1/chat/completions
  model: gpt-5.4-mini

deepl:
  api:
    key: ${deepl.api.key}
