spring:
  config:
    import: ""

  # AWS Secrets Manager 같은 외부 의존성 비활성화
  cloud:
    aws:
      secretsmanager:
        enabled: false
      credentials:
        access-key: test-key
        secret-key: test-key
      region:
        static: ap-northeast-2
      stack:
        auto: false


  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1   # ← NON_KEYWORDS=USER 추가
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

# JWT 더미값 (테스트용)
jwt:
  secret: test-secret-key-for-junit-testing-purpose-only-must-be-at-least-256-bits-long-string
  access-expiration: 3600000
  refresh-expiration: 1209600000

# 외부 API 더미값
openai:
  api:
    key: test-key
    url: https://api.openai.com/v1/chat/completions
    model: gpt-5.4-mini

deepl:
  api:
    key: test-key

google:
  client-id: "mock-google-client-id"

cors:
  allowed-origins:
    - "https://test-environment-bypass.clip-server.com"

youtube:
  api:
    key: test-key
    base-url: https://www.googleapis.com/youtube/v3

admin:
  api-key: test-key

azure:
  speech:
    key: test-key
    region: koreacentral
    language: en-US
    voice-name-female: en-US-JennyNeural
    voice-name-male: en-US-GuyNeural

aws:
  region: ap-northeast-2
  profile: clipzy-sso
  s3:
    bucket: test-bucket
    audio-prefix: chat/
    presigned-url-expiration: 300  # 5분

clipzy:
  notice:
    base-url: https://clipzy.test.com