services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/service-env.inc:/etc/nginx/conf.d/service-env.inc
      - ./nginx/logs:/var/log/nginx
    restart: always
    networks:
      - app_default

  metabase:
    image: metabase/metabase
    container_name: metabase
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=mysql
      - MB_DB_DBNAME=metabase_internal
      - MB_DB_PORT=3306
      - MB_DB_USER=${MB_DB_USER}
      - MB_DB_PASS=${MB_DB_PASS}
      - MB_DB_HOST=${MB_DB_HOST}
    networks:
      - app_default
    restart: always

  app-a:
    build:
      context: .
    container_name: spring-app-a
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SERVER_PORT=${SERVER_PORT}
    volumes:
      - /home/ubuntu/app/log:/home/ubuntu/app/log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always
    networks:
      - app_default

  app-b:
    build:
      context: .
    container_name: spring-app-b
    ports:
      - "8082:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SERVER_PORT=${SERVER_PORT}
    volumes:
      - /home/ubuntu/app/log:/home/ubuntu/app/log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always
    networks:
      - app_default

networks:
  app_default:
    external: true
