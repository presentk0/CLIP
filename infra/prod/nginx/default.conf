# WebSocket 업그레이드 매핑
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Spring Boot 애플리케이션 라우팅
server {
    listen 80;
    server_name localhost;

    include /etc/nginx/conf.d/service-env.inc;

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    #  WebSocket 전용 (가장 먼저 매칭)
    location /ws-chat {
        proxy_pass $service_url;
        
        # WebSocket 필수 설정
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # 일반 헤더
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 타임아웃 (WebSocket 장시간 연결)
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 60s;
        
        # 버퍼링 비활성화 (실시간 메시지)
        proxy_buffering off;
    }

    # 헬스체크
    location /health {
        return 200 'OK';
        access_log off;
    }

    # 일반 HTTP 요청 (위 두 개 외 모든 것)
    location / {
        proxy_pass $service_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Metabase 서브도메인 라우팅
server {
    listen 80;
    server_name metabase.clip-server.com;

    # 대용량 쿼리나 파일 다운로드 시 장시간 연결 보장
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    location / {
        proxy_pass http://metabase:3000;

        # HTTP 헤더 그대로 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ALB로 받은 정보를 Metabase에 전달
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Metabase 웹소켓 및 실시간 대시보드 새로고침 지원
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
